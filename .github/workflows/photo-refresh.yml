name: Photo refresh

# Re-resolves every species photograph from Wikipedia and opens a pull request
# when anything moved.
#
# This replaces the old Photo Link Checker, which could only tell us a picture
# had died — someone then had to find a replacement by hand, and nobody did.
# Rebuilding the snapshot fixes the same class of failure without a human:
# when a Commons file is renamed, re-uploaded or deleted, the article's lead
# image changes with it, and the rebuild picks up whatever is there now.

on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'js/speciesData.js'
      - 'js/photoSnapshot.js'
      - 'scripts/build-photo-snapshot.mjs'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Rebuild the snapshot from Wikipedia
        run: node scripts/build-photo-snapshot.mjs

      # Resolving an article is not the same as the image actually being
      # served, so spot-check a sample of the URLs we just wrote. A handful is
      # enough to catch a systemic break (wrong host, wrong width rewrite)
      # without hammering Wikimedia with 386 requests every week.
      - name: Verify a sample of the resolved URLs
        run: |
          node --input-type=module -e "
            import {PHOTO_SNAPSHOT} from './js/photoSnapshot.js';
            const ids = Object.keys(PHOTO_SNAPSHOT);
            const step = Math.max(1, Math.floor(ids.length / 25));
            console.log(ids.filter((_, i) => i % step === 0).map(id => PHOTO_SNAPSHOT[id].thumb).join('\n'));
          " > /tmp/sample.txt
          broken=0
          while IFS= read -r url; do
            [ -z "$url" ] && continue
            # A full GET, not a range request. `-r 0-0` gets a 400 from the
            # thumbnail handler while originals serve fine — the first run of
            # this job reported 26 of 27 sampled thumbnails broken and the one
            # success was the only URL with no /thumb/ segment. HEAD is out
            # too: the CDN answers 404 to HEAD on thumbnails. Twenty-five whole
            # images once a week is a rounding error.
            status=$(curl -o /dev/null -s -w '%{http_code}' -L --max-time 25 \
              -H "User-Agent: TreeOfLife/1.0 (https://www.treeoflife.wiki; CI)" "$url" || echo 000)
            if [ "$status" -ge 200 ] && [ "$status" -lt 400 ]; then
              echo "ok   [$status] $url"
            else
              echo "FAIL [$status] $url"; broken=$((broken+1))
            fi
            sleep 1
          done < /tmp/sample.txt
          echo "--- $broken broken of the sample ---"
          # One or two can legitimately fail mid-rename; a systemic break shows
          # up as most of the sample failing at once.
          if [ "$broken" -gt 3 ]; then
            echo "Too many sampled URLs are unreachable — not proposing this snapshot."
            exit 1
          fi

      - name: Open a pull request if the snapshot moved
        if: github.event_name != 'pull_request'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/photo-refresh
          title: 'data: refresh species photographs from Wikipedia'
          commit-message: 'data: refresh species photographs from Wikipedia'
          body: |
            Automated weekly rebuild of `js/photoSnapshot.js`.

            Each entry is whatever image the species' Wikipedia article carries
            today, cut to the two sizes the site uses. A diff here means an
            article changed its lead image — usually because the old file was
            renamed, re-uploaded or deleted on Commons, which is exactly the
            rot the old link checker could report but not repair.

            A sample of the new URLs was fetched and served successfully before
            this was opened.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          delete-branch: true
