name: Silhouettes

# Resolves a PhyloPic silhouette for every taxon and opens a pull request when
# the set changes.
#
# The sandbox this project is developed in cannot reach api.phylopic.org, so
# this runs where the network is open. Unlike the photographs, silhouettes are
# committed to the repository and shipped: they are a few kilobytes of SVG
# each, and having them local means the tree never waits on a third party to
# draw itself.

on:
  workflow_dispatch:
  # Quarterly. PhyloPic gains silhouettes steadily but not quickly, and each
  # run is a few hundred API calls.
  schedule:
    - cron: '0 7 1 */3 *'

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve silhouettes
        run: node scripts/build-silhouettes.mjs

      - name: Summarise
        run: |
          echo "$(ls assets/silhouettes | wc -l) silhouettes, $(du -sh assets/silhouettes | cut -f1) total"

      - name: Open a pull request if the set changed
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/silhouettes
          title: 'data: refresh PhyloPic silhouettes'
          commit-message: 'data: refresh PhyloPic silhouettes'
          body: |
            Automated rebuild of `assets/silhouettes/` and `js/silhouettes.js`.

            A diff means PhyloPic gained, replaced or withdrew a silhouette for
            one of our taxa.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
          delete-branch: true
