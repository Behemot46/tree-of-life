name: Smoke Checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — only the latest push matters.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Browser smoke checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke checks
        run: npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: .smoke-out/
          # .smoke-out is a dotfile, and upload-artifact skips hidden paths
          # unless told otherwise — so this step had been uploading nothing
          # since it was written, logging "No files were found" under a green
          # run while CLAUDE.md promised the screenshots on every run. The
          # suite is meant to be looked at, not only counted; if-no-files-found
          # stays on `warn` so a genuinely empty run still does not fail CI.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
