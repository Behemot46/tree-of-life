name: Smoke Checks

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — only the latest push matters.
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scenario:
    name: Smoke ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    # One scenario is a few minutes; the Chromium install has taken anywhere from
    # half a minute to nearly six. The six run side by side, so the wall-clock is
    # the slowest one, not their sum (the single job took 17 of its 30 minutes).
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario: [desktop-en, desktop-he, desktop-ru, phone-en, phone-he, desktop-en-light]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke checks
        run: npm run smoke -- --only ${{ matrix.scenario }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-${{ matrix.scenario }}
          path: .smoke-out/
          # .smoke-out is a dotfile, and upload-artifact skips hidden paths
          # unless told otherwise. if-no-files-found stays on `warn` so a
          # genuinely empty run still does not fail CI.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  # The check a branch rule or a reader looks for keeps its old name: it is green
  # only when every scenario was, and red if any was red, cancelled or skipped.
  smoke:
    name: Browser smoke checks
    needs: scenario
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All scenarios green
        run: |
          if [ "${{ needs.scenario.result }}" != "success" ]; then
            echo "scenarios: ${{ needs.scenario.result }}"; exit 1
          fi
