name: Verify Deployment

# Runs the smoke checks against the site Vercel just published, so a green
# build is not mistaken for a working page. Fires on Vercel's deployment
# status rather than on push, because only Vercel knows the deployed URL.
on:
  deployment_status:
  # Lets the live site be checked on demand — after a DNS change, or to prove
  # the custom domain serves before GitHub Pages is retired.
  workflow_dispatch:
    inputs:
      url:
        description: 'Site to check (defaults to the production domain)'
        required: false
        default: 'https://www.treeoflife.wiki'

jobs:
  smoke:
    name: Smoke the deployed site
    # Preview deployments can sit behind Vercel's deployment protection, which
    # would fail the run for an authentication reason rather than a real one.
    # Production is what stage 4 needs to prove anyway.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Check the site with the suite from the commit that produced it.
          # On a manual run there is no deployment, so use the default branch.
          ref: ${{ github.event.deployment.sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Prefer the address visitors actually use. Vercel's target_url is the
      # per-deployment hostname, which skips the custom domain, its redirect
      # and its certificate — the parts most likely to be misconfigured.
      - name: Choose the URL to check
        id: target
        run: |
          if [ -n "${{ inputs.url }}" ]; then
            echo "url=${{ inputs.url }}" >> "$GITHUB_OUTPUT"
          else
            echo "url=https://www.treeoflife.wiki" >> "$GITHUB_OUTPUT"
          fi

      - name: Run smoke checks against ${{ steps.target.outputs.url }}
        run: npm run smoke -- --url "${{ steps.target.outputs.url }}"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-smoke-screenshots
          path: .smoke-out/
          if-no-files-found: warn
          retention-days: 14
